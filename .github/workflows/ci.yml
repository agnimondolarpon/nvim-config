name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: install.sh syntax and dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n install.sh

      - name: Dry run
        run: ./install.sh --dry-run --yes --no-font
